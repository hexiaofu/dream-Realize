# 圆梦社区 Nginx 配置：放到 http {} 中引用（例如 /etc/nginx/conf.d/dream.conf）。
#   https://www.qhlaotie.cn/dream/       → 后端 Spring Boot（127.0.0.1:18080），转发时去掉 /dream 前缀
#   https://www.qhlaotie.cn/dream-admin/ → 管理后台静态文件（admin/dist）
#   https://www.qhlaotie.cn/dream-h5/    → 用户端 H5 静态文件（frontend/dist/build/h5）
# 后端需配套环境变量：ADMIN_COOKIE_PATH=/dream/api/admin、ADMIN_COOKIE_SECURE=true、CORS_ORIGINS=https://www.qhlaotie.cn
# 需要按实际修改的只有：证书路径、静态文件目录、后端端口。

upstream dream_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

# HTTP 统一跳转到 HTTPS（后台登录 Cookie 带 Secure，必须走 HTTPS）。
server {
    listen 80;
    server_name www.qhlaotie.cn qhlaotie.cn;
    return 301 https://www.qhlaotie.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.qhlaotie.cn;

    ssl_certificate     /etc/nginx/ssl/www.qhlaotie.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.qhlaotie.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dream_ssl:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # 后端接口：/dream/api/... → http://127.0.0.1:18080/api/...（proxy_pass 结尾的 / 去掉 /dream 前缀）。
    location /dream/ {
        proxy_pass http://dream_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dream;

        # 图片每张 10 MB、视频 100 MB；上传直接流式转发给后端，不先落盘到 Nginx。
        client_max_body_size 101m;
        client_body_timeout 300s;
        proxy_request_buffering off;

        # 视频播放与拖动依赖后端的 Range 响应，Nginx 原样透传 Range 头；媒体缓存策略由后端控制（no-store）。
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 管理后台（admin/dist），产物使用相对路径，可放在任意子目录。
    location /dream-admin/ {
        alias /var/www/dream-admin/;
        index index.html;
        add_header Cache-Control "no-cache";
        location /dream-admin/assets/ {
            alias /var/www/dream-admin/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 用户端 H5（frontend/dist/build/h5），hash 路由，无需 history 回退。
    location /dream-h5/ {
        alias /var/www/dream-h5/;
        index index.html;
        add_header Cache-Control "no-cache";
        location /dream-h5/assets/ {
            alias /var/www/dream-h5/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
