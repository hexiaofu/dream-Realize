server:
  port: ${SERVER_PORT:18080}
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: dream-realize
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dream_realize?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
app:
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
  admin-cookie-secure: ${ADMIN_COOKIE_SECURE:false}
  media-dir: ${MEDIA_DIR:./uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:18173,http://127.0.0.1:18173,http://localhost:18174,http://127.0.0.1:18174}
  demo-data: false
